<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>E2E</title></head>
<body>
<div id="TESTOUT">running…</div>
<iframe id="app" style="width:1280px;height:800px;border:0"></iframe>
<script>
/* 端到端：在真浏览器里驱动真实 UI。单元测试只证明匹配引擎对，
   这里证明它真的接到了格子上、并且整条游玩链路（含完成态、撤销、开关）是通的。 */
(async function () {
  const R = [];
  const ok = (n, c, e) => R.push((c ? "PASS" : "FAIL") + " :: " + n + (e !== undefined ? "  [" + e + "]" : ""));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const doc = {
    v: 1, id: "e2egrid", title: "E2E 测试", description: "", size: 2,
    rows: [{ label: "能吃" }, { label: "不能吃" }],
    cols: [{ label: "圆" }, { label: "方" }],
    cells: {}, similarSearch: true, status: "unlisted", updatedAt: 0,
  };
  const seed = {
    "0,0": { t: "橙子", al: ["橙", "橘子"], sy: ["柑"] },
    "1,0": { t: "三明治", al: [], sy: [] },
    "0,1": { t: "硬币", al: [], sy: [] },
    "1,1": { t: "书", al: [], sy: ["书籍"] },
  };
  for (const k in seed) {
    const [x, y] = k.split(",").map(Number);
    doc.cells[k] = { x, y, status: "empty", answers: [{ id: "a" + x + y, text: seed[k].t, aliases: seed[k].al, synonyms: seed[k].sy }] };
  }
  localStorage.setItem("ag.doc.e2egrid", JSON.stringify(doc));
  localStorage.setItem("ag.mine.v1", JSON.stringify([{ id: "e2egrid", title: "E2E 测试", size: 2, updatedAt: Date.now(), status: "unlisted" }]));

  const frame = document.getElementById("app");
  const goto = (path) => new Promise((res) => { frame.onload = res; frame.src = path; });

  await goto("/grid/e2egrid");
  await sleep(1200);

  let w = frame.contentWindow, d = frame.contentDocument;
  const cell = (k) => d.querySelector('[data-cell="' + k + '"]');
  const progress = () => (d.body.textContent.match(/(\d+)\/4/) || [])[1];

  /** React 受控输入必须走原生 setter —— 直接赋 .value 不会触发 onChange */
  function type(el, text) {
    const setter = Object.getOwnPropertyDescriptor(w.HTMLInputElement.prototype, "value").set;
    setter.call(el, text);
    el.dispatchEvent(new w.Event("input", { bubbles: true }));
  }
  /** 打开某格输入框、打字、回车 */
  async function answer(k, text) {
    cell(k).dispatchEvent(new w.MouseEvent("dblclick", { bubbles: true }));
    await sleep(220);
    const input = cell(k).querySelector("input");
    if (!input) return false;
    type(input, text);
    input.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
    await sleep(450);
    return true;
  }
  const textOf = (k) => cell(k).textContent.trim();

  try {
    ok("1 棋盘渲染出 4 个格子", d.querySelectorAll("[data-cell]").length === 4,
       "count=" + d.querySelectorAll("[data-cell]").length);
    ok("2 初始进度 0/4", progress() === "0", "progress=" + progress());

    /* --- 别名档 --- */
    await answer("0,0", "橙");                       // "橙" 是"橙子"的别名，不是主答案
    ok("3 别名「橙」被接受", textOf("0,0").includes("✓"), "格内文本=" + JSON.stringify(textOf("0,0")));
    ok("3b 提交后编辑器自动关闭", !cell("0,0").querySelector("input"),
       cell("0,0").querySelector("input") ? "输入框仍在" : "已关闭");
    ok("3c 答案文本显示在格子里", textOf("0,0").includes("橙"),
       "格内文本=" + JSON.stringify(textOf("0,0")));
    ok("4 进度更新为 1/4", progress() === "1", "progress=" + progress());

    /* --- 精确档 --- */
    await answer("1,0", "三明治");
    ok("5 精确答案被接受，进度 2/4", progress() === "2", "progress=" + progress());

    /* --- 错误答案 --- */
    await answer("0,1", "香蕉");
    ok("6 无关答案判为不符", textOf("0,1").includes("✕"), "格内文本=" + JSON.stringify(textOf("0,1")));
    ok("7 错误答案不计入进度", progress() === "2", "progress=" + progress());

    /* --- 同义词档 --- */
    await answer("1,1", "书籍");                     // "书籍" 是"书"的同义词
    ok("8 同义词「书籍」被接受", textOf("1,1").includes("✓"), "格内文本=" + JSON.stringify(textOf("1,1")));
    ok("9 进度 3/4", progress() === "3", "progress=" + progress());

    /* --- 完成态 --- */
    await answer("0,1", "硬币");
    await sleep(600);
    ok("10 四格填满后弹出完成卡片", d.body.textContent.includes("全部完成"),
       "含完成文案=" + d.body.textContent.includes("全部完成") + " progress=" + progress());

    /* --- 撤销 --- */
    const sheetClose = d.querySelector('[aria-label="关闭"]');
    if (sheetClose) sheetClose.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
    await sleep(300);
    w.dispatchEvent(new w.KeyboardEvent("keydown", { key: "z", ctrlKey: true, bubbles: true }));
    d.body.dispatchEvent(new w.KeyboardEvent("keydown", { key: "z", ctrlKey: true, bubbles: true }));
    await sleep(500);
    ok("11 Ctrl+Z 撤销最后一格作答", progress() === "3", "撤销后 progress=" + progress());

    /* --- 关闭相似搜索后，别名/同义词必须一律失效 --- */
    await goto("/grid/e2egrid/edit");
    await sleep(1300);
    w = frame.contentWindow; d = frame.contentDocument;
    const toggle = d.querySelector('input[type="checkbox"]');
    ok("12 创建器里存在相似搜索开关", !!toggle, toggle ? "ok" : "无开关");
    if (toggle) {
      toggle.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
      await sleep(700);
      await goto("/grid/e2egrid");
      await sleep(1300);
      w = frame.contentWindow; d = frame.contentDocument;
      const before = progress();
      await answer("0,0", "橙");                     // 关掉之后，别名不该再被接受
      const c = d.querySelector('[data-cell="0,0"]');
      ok("13 关闭相似搜索后别名不再被接受", c.textContent.includes("✕"),
         "格内文本=" + JSON.stringify(c.textContent.trim()) + " 关闭前进度=" + before);
    }
    /* ================= 3D：立方体 / 平面层两种视图 ================= */
    /* 三维题走 open 模式（无预设答案）。这里**故意不配裁判**，
       验证"判定失败 ≠ 答案错误"—— 这是这个产品最不能撒谎的一处。 */
    localStorage.removeItem("ag.judge.v1");
    const d3 = {
      v: 2, id: "e2e3d", title: "E2E 三维", description: "", judgeMode: "open",
      axes: [
        { label: "尺寸", values: ["极小", "常规", "巨大"] },
        { label: "速度", values: ["静止", "中速", "极快"] },
        { label: "危险", values: ["无害", "有风险", "致命"] },
      ],
      /* similarSearch 故意开着：验证隐藏「自动填充」的是 open 模式本身，不是这个开关 */
      cells: {}, similarSearch: true, status: "unlisted", updatedAt: 0,
    };
    for (let z = 0; z < 3; z++) for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++)
      d3.cells[x + "," + y + "," + z] = { x: x, y: y, z: z, answers: [], status: "empty" };
    localStorage.setItem("ag.doc.e2e3d", JSON.stringify(d3));

    await goto("/grid/e2e3d");
    await sleep(1400);
    w = frame.contentWindow; d = frame.contentDocument;

    const scene = d.querySelector('[data-cube="1"]');
    ok("14 三维题渲染出立方体场景", !!scene, scene ? "ok" : "无 .ag3d-scene");
    ok("15 立方体有 27 个方块", d.querySelectorAll("[data-cell]").length === 27,
       "count=" + d.querySelectorAll("[data-cell]").length);
    ok("16 每个方块有 6 个面", d.querySelectorAll(".ag3d-face").length === 162,
       "faces=" + d.querySelectorAll(".ag3d-face").length);

    /* 点方块 → 底部浮层输入 → 提交。没配裁判，应落到"判定失败"而非"答错" */
    const cube = d.querySelector('[data-cell="0,0,0"]');
    cube.dispatchEvent(new w.PointerEvent("pointerup", { bubbles: true }));
    await sleep(300);
    const box = d.querySelector('input[placeholder*="同时符合"]');
    ok("17 点方块弹出作答浮层", !!box, box ? "ok" : "无输入框");
    if (box) {
      type(box, "测试词");
      box.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
      await sleep(600);
      const c = d.querySelector('[data-cell="0,0,0"]');
      ok("18 没配裁判时判为「判定失败」而非「答错」",
         c.classList.contains("is-err") && !c.classList.contains("is-bad"),
         "class=" + c.className);
      ok("19 判定失败不计入完成进度",
         (d.body.textContent.match(/(\d+)\/27/) || [])[1] === "0",
         "progress=" + (d.body.textContent.match(/(\d+)\/27/) || [])[1]);
    }

    /* 切到平面层：一次只看一层，9 格 */
    const flatBtn = [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "平面层");
    ok("20 存在「平面层」切换按钮", !!flatBtn, flatBtn ? "ok" : "无按钮");
    if (flatBtn) {
      flatBtn.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
      await sleep(500);
      ok("21 平面层一次只显示 9 格", d.querySelectorAll("[data-cell]").length === 9,
         "count=" + d.querySelectorAll("[data-cell]").length);
      const tabs = d.querySelectorAll("[data-layer]");
      ok("22 平面层有 3 个层页签", tabs.length === 3, "tabs=" + tabs.length);
      if (tabs.length === 3) {
        ok("23 平面层与立方体共用同一份作答",
           !!d.querySelector('[data-cell="0,0,0"]')?.textContent.includes("测试词"),
           "格内文本=" + JSON.stringify(d.querySelector('[data-cell="0,0,0"]')?.textContent));
        tabs[2].dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
        await sleep(400);
        ok("24 切到第 3 层看到的是 z=2 的格子", !!d.querySelector('[data-cell="0,0,2"]'),
           "有 0,0,2 = " + !!d.querySelector('[data-cell="0,0,2"]'));
      }
    }

    /* 三维题不该出现二维专属的「自动填充」（开放模式没有可比对的答案） */
    ok("25 开放模式不提供「自动填充」", !d.body.textContent.includes("自动填充"),
       "出现自动填充=" + d.body.textContent.includes("自动填充"));

    /* ================= 3D 创建器 ================= */
    await goto("/grid/e2e3d/edit");
    await sleep(1500);
    w = frame.contentWindow; d = frame.contentDocument;

    const axisInputs = [...d.querySelectorAll("input")].filter((i) =>
      (i.placeholder || "").includes("这条轴叫什么"));
    ok("26 创建器为 3D 题渲染三条轴", axisInputs.length === 3, "轴数=" + axisInputs.length);
    const traitInputs = [...d.querySelectorAll("input")].filter((i) =>
      (i.placeholder || "").startsWith("第 ") && (i.placeholder || "").includes("个特质"));
    ok("27 三条轴共 9 个特质输入框", traitInputs.length === 9, "特质数=" + traitInputs.length);

    /* 改一个特质，回到游玩页应该看到新条件 —— 证明创建器写的是真文档 */
    type(axisInputs[0], "体量");
    type(traitInputs[0], "纳米级");
    await sleep(900);
    await goto("/grid/e2e3d");
    await sleep(1400);
    w = frame.contentWindow; d = frame.contentDocument;
    ok("28 创建器改的轴名与特质出现在游玩页",
       d.body.textContent.includes("体量") && d.body.textContent.includes("纳米级"),
       "轴名=" + d.body.textContent.includes("体量") + " 特质=" + d.body.textContent.includes("纳米级"));

    /* open 模式默认不该出现「格子的正确答案」面板 —— 那格根本没有标准答案 */
    ok("29 开放模式不显示「格子的正确答案」面板",
       !d.body.textContent.includes("格子的正确答案"),
       "出现=" + d.body.textContent.includes("格子的正确答案"));

    /* ================= 首页入口 ================= */
    await goto("/");
    await sleep(1300);
    w = frame.contentWindow; d = frame.contentDocument;
    const newBtn = [...d.querySelectorAll("button")].find((b) => (b.textContent || "").includes("新建 3D 题"));
    ok("30 首页有「新建 3D 题」入口", !!newBtn, newBtn ? "ok" : "无入口");
    if (newBtn) {
      newBtn.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
      await sleep(1500);
      w = frame.contentWindow; d = frame.contentDocument;
      /* 创建器默认开平面层 —— 分层编辑比转立方体顺手；立方体是切过去的可选视图 */
      ok("31 新 3D 题创建器默认显示平面层（9 格 + 3 个层页签）",
         d.querySelectorAll("[data-cell]").length === 9 && d.querySelectorAll("[data-layer]").length === 3,
         "cells=" + d.querySelectorAll("[data-cell]").length + " layers=" + d.querySelectorAll("[data-layer]").length);
      ok("32 新 3D 题默认开放造词（会提示配裁判）",
         d.body.textContent.includes("AI 裁判"),
         "含 AI 裁判=" + d.body.textContent.includes("AI 裁判"));
      const cubeBtn = [...d.querySelectorAll("button")].find((b) => b.textContent.trim() === "立方体");
      if (cubeBtn) {
        cubeBtn.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
        await sleep(600);
        ok("33 创建器可切到立方体视图，显示全部 27 格",
           d.querySelectorAll("[data-cell]").length === 27,
           "count=" + d.querySelectorAll("[data-cell]").length);
      } else {
        ok("33 创建器可切到立方体视图，显示全部 27 格", false, "无「立方体」按钮");
      }
    }
  } catch (e) {
    R.push("FAIL :: 异常 [" + (e && e.message ? e.message : e) + "]");
  }

  document.getElementById("TESTOUT").textContent =
    "\n@@TEST_BEGIN@@\n" + R.join("\n") +
    "\n@@SUMMARY@@ PASS=" + R.filter((s) => s[0] === "P").length +
    " FAIL=" + R.filter((s) => s[0] === "F").length + "\n@@TEST_END@@";
})();
</script>
</body>
</html>
