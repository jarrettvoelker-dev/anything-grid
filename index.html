      (function () {
        var q = new URLSearchParams(location.search);
        var p = q.get("p");
        if (p) {
          q.delete("p");
          var s = q.toString();
          history.replaceState(null, "", p + (s ? "?" + s : "") + location.hash);
        }
      })();
